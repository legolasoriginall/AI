name = "ai-assistant-proxy"
main = "index.js"
compatibility_date = "2026-11-01"

# دامنه‌ای که اجازهٔ تماس دارد؛ دامنهٔ سایت GitHub Pages شما.
# چند دامنه را با کاما جدا کنید (مثلاً دامنهٔ پیش‌نمایش).
[vars]
ALLOWED_ORIGINS = "https://legolasoriginall.github.io"
MODEL = "openai/gpt-6-luna"
MAX_TOKENS = "800"
RATE_LIMIT = "20"
RATE_WINDOW_MS = "600000"

# کلید را به‌صورت Secret بگذارید، نه در این فایل:
#   npx wrangler secret put NUMES_API_KEY

[observability]
enabled = true
