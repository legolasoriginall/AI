name: publish-linux-guide

on:
  push:
    paths:
      - ".github/workflows/publish-linux-guide.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the guide page and link it from setup
        run: python3 scripts/_publish_linux_guide.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git add -A .publish 2>/dev/null || true
          git commit -m "docs: add the Linux CLI guide page and link it from the setup page"
          git push
