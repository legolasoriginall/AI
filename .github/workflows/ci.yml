name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: py_compile (all modules)
        run: python -m py_compile $(git ls-files '*.py')
      - name: Pytest
        run: python -m pytest

  cli-smoke:
    name: CLI smoke (fresh venv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the documented CLI commands end to end
        run: bash scripts/smoke_cli.sh
