name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: pytest, py_compile, catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: py_compile
        run: |
          python -m py_compile agent.py providers.py server.py store.py tools.py scripts/check_catalog.py
      - name: Catalog consistency
        run: python scripts/check_catalog.py
      - name: Pytest
        run: python -m pytest

  worker:
    name: worker tests, node --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check
        run: |
          node --check docs/models.js
          node --check docs/app.js
          node --check docs/examples.js
          node --check web/app.js
      - name: Worker tests
        run: node worker/test.mjs
