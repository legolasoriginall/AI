name: patch-font-models

on:
  push:
    paths:
      - ".github/workflows/patch-font-models.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Persian-subset Vazirmatn woff2
        run: |
          set -euo pipefail
          mkdir -p docs/fonts
          url="https://fonts.gstatic.com/s/vazirmatn/v16/Dxxo8j6PP2D_kU2muijlGMWWMmk.woff2"
          if curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/120.0" -o docs/fonts/vazirmatn-arabic.woff2 "$url" && head -c 4 docs/fonts/vazirmatn-arabic.woff2 | grep -q "wOF2"; then
            echo "downloaded the arabic subset from gstatic"
          else
            echo "gstatic unavailable; building the subset from jsdelivr" >&2
            pip install --quiet fonttools brotli
            curl -fsSL -o /tmp/vazirmatn-var.woff2 "https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2"
            pyftsubset /tmp/vazirmatn-var.woff2 --flavor=woff2 --unicodes="U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF" --output-file=docs/fonts/vazirmatn-arabic.woff2
            head -c 4 docs/fonts/vazirmatn-arabic.woff2 | grep -q "wOF2"
          fi
          size=$(stat -c%s docs/fonts/vazirmatn-arabic.woff2)
          echo "font size: $size bytes"
          test "$size" -gt 15000
      - name: Apply text patches
        run: python3 scripts/patch_font_models.py
      - name: Sanity checks
        run: |
          grep -q 'fonts/vazirmatn-arabic.woff2' docs/index.html
          ! grep -q 'fonts.googleapis.com' docs/index.html
          ! grep -q 'models.js' docs/index.html
          grep -q 'font-display: swap' docs/style.css
          node --check docs/app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/style.css docs/app.js docs/fonts/vazirmatn-arabic.woff2
          if git diff --staged --quiet; then echo "nothing to commit"; else git commit -m "perf(demo): self-host the Persian Vazirmatn subset and lazy-load models.js"; git push; fi
