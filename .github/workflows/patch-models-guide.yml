name: patch-models-guide

on:
  push:
    paths:
      - ".github/workflows/patch-models-guide.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tunnel guide text
        run: python3 scripts/patch_guide.py
      - name: Commit docs change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/models.js
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "docs(models): document scripts/ollama_tunnel.sh for HTTPS Ollama"
            git push
          fi
