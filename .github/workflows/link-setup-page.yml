name: link-setup-page

on:
  push:
    paths:
      - ".github/workflows/link-setup-page.yml"

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add links to the setup page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          subs = [
              ('      <a href="#start">راه‌اندازی</a>\n',
               '      <a href="#start">راه‌اندازی</a>\n      <a href="setup.html">راهنمای نصب</a>\n'),
              ('        <a href="https://github.com/legolasoriginall/AI#readme" target="_blank" rel="noopener">مستندات</a>\n',
               '        <a href="setup.html">راهنمای نصب</a>\n'),
              ('        <p>پایتون ۳.۱۰ یا بالاتر لازم است. برای حالت آفلاین، Ollama روی همان دستگاه کافی است.</p>\n',
               '        <p>پایتون ۳.۱۰ یا بالاتر لازم است. برای حالت آفلاین، Ollama روی همان دستگاه کافی است.</p>\n        <p class="muted small"><a href="setup.html">راهنمای کامل راه‌اندازی — سه مسیر با دستورهای کپی‌پذیر</a></p>\n'),
          ]
          for old, new in subs:
              assert text.count(old) == 1, old[:60]
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          grep -c 'href="setup.html"' docs/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then echo "nothing to commit"; else git commit -m "feat(demo): link the setup page from the nav, footer and start section"; git push; fi
