name: patch-connect-test

on:
  push:
    paths:
      - ".github/workflows/patch-connect-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add connection-test UI
        run: python3 scripts/patch_connect_test.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/style.css
          if git diff --staged --quiet; then echo "nothing to commit"; else git commit -m "feat(demo): wire the connection-test button into the settings form"; git push; fi
