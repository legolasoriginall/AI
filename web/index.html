<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دستیار دیجیتال</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">◆</div>
        <div>
          <h1>دستیار دیجیتال</h1>
          <span class="muted">آفلاین و آنلاین</span>
        </div>
      </div>

      <button class="btn new-chat" id="new-chat">+ گفتگوی جدید</button>
      <div class="chat-list" id="chat-list"></div>

      <div class="sidebar-footer">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">در حال بررسی…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="toggle-sidebar" title="نمایش/پنهان‌کردن گفتگوها">☰</button>
        <div class="model-info">
          <strong id="provider-label">دستیار</strong>
          <span class="muted" id="model-label"></span>
        </div>
        <button class="icon-btn" id="open-settings" title="تنظیمات">⚙</button>
      </header>

      <section class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">◆</div>
          <h2>چطور می‌توانم کمک کنم؟</h2>
          <p class="muted">فایل بساز، دستور اجرا کن، یا فقط سؤال بپرس. حافظهٔ من محلی است.</p>
          <div class="chips">
            <button class="chip" data-prompt="پوشهٔ workspace چه فایل‌هایی دارد؟">فایل‌های workspace</button>
            <button class="chip" data-prompt="یک فایل hello.py بساز که سلام چاپ کند، بعد اجرا کن.">ساخت و اجرای کد</button>
            <button class="chip" data-prompt="به یاد بسپار که نام پروژه‌ام «AI» است.">ثبت در حافظه</button>
            <button class="chip" data-prompt="چه چیزهایی را دربارهٔ من به خاطر داری؟">حافظهٔ من</button>
          </div>
        </div>
      </section>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="پیامت را بنویس… (Enter برای ارسال، Shift+Enter برای خط جدید)"></textarea>
        <button type="submit" class="send" id="send" title="ارسال">↑</button>
        <button type="button" class="send stop hidden" id="stop" title="توقف">■</button>
      </form>
      <p class="hint muted">ابزارها داخل پوشهٔ <code>workspace</code> اجرا می‌شوند که ابزارها در آن محدود شده‌اند.</p>
    </main>
  </div>

  <div class="overlay hidden" id="settings-overlay">
    <div class="panel">
      <div class="panel-head">
        <h3>تنظیمات</h3>
        <button class="icon-btn" id="close-settings">✕</button>
      </div>
      <label>
        ارائه‌دهنده
        <select id="provider">
          <option value="auto">خودکار (اول آفلاین، بعد آنلاین)</option>
          <option value="ollama">فقط آفلاین — Ollama</option>
          <option value="gemini">آنلاین — Google Gemini</option>
          <option value="openai">آنلاین — API سازگار با OpenAI</option>
        </select>
      </label>
      <label>
        آدرس Ollama
        <input id="ollama-url" dir="ltr" placeholder="http://localhost:11434">
      </label>
      <label>
        مدل Ollama
        <input id="ollama-model" dir="ltr" placeholder="llama3.2">
      </label>
      <label>
        مدل آنلاین
        <input id="online-model" dir="ltr" placeholder="gpt-4o-mini / gemini-2.0-flash">
      </label>
      <label>
        دستور سیستمی
        <textarea id="system-prompt" rows="4"></textarea>
      </label>
      <p class="muted small">کلیدهای API از فایل <code>.env</code> خوانده می‌شوند؛ اینجا وارد نشوند.</p>
      <button class="btn primary" id="save-settings">ذخیره</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
